<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeSinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/video.js@8.23.4/dist/video-js.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=6" />
  </head>
  <body>
    <div class="house" aria-hidden="true">
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
      <div class="grain"></div>
    </div>

    <main class="layout">
      <header class="marquee">
        <p class="marquee-tag">Now showing</p>
        <h1>DeSinema</h1>
      </header>

      <div class="toolbar">
        <nav class="tabs" role="tablist" aria-label="Browse">
          <button
            type="button"
            class="tab"
            id="tab-home"
            role="tab"
            data-tab="home"
            aria-selected="true"
            aria-controls="home-panel"
          >
            Home
          </button>
          <button
            type="button"
            class="tab"
            id="tab-latest"
            role="tab"
            data-tab="latest"
            aria-selected="false"
            aria-controls="latest-panel"
          >
            Latest
          </button>
          <button
            type="button"
            class="tab"
            id="tab-top"
            role="tab"
            data-tab="top"
            aria-selected="false"
            aria-controls="top-panel"
          >
            Top
          </button>
          <button
            type="button"
            class="tab"
            id="tab-pick"
            role="tab"
            data-tab="pick"
            aria-selected="false"
            aria-controls="pick-panel"
          >
            Pick
          </button>
        </nav>
        <div class="toolbar-controls">
          <label class="field language-field">
            <span class="visually-hidden">Language</span>
            <select id="language" name="lang" aria-label="Language">
              {% for language in languages %}
              <option value="{{ language }}"{% if loop.first %} selected{% endif %}>{{ language|capitalize }}</option>
              {% endfor %}
            </select>
          </label>
          <form id="search-form" class="search-form">
            <label class="field query-field">
              <span class="visually-hidden">Title</span>
              <input
                id="query"
                name="q"
                type="search"
                placeholder="Search a movie"
                autocomplete="off"
                required
              />
            </label>
            <button type="submit" aria-label="Search">
              <span class="search-label">Search</span>
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2" />
                <path d="M15.5 15.5 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </button>
          </form>
        </div>
      </div>

      <p id="status" class="status" role="status" hidden></p>

      <div class="stage">
        <section id="player-panel" class="player-panel">
          <div class="screen-frame">
            <p id="now-playing" class="now-playing">Select a movie to play</p>
            <video
              id="player"
              class="video-js vjs-big-play-centered desinema-player"
              playsinline
              preload="metadata"
            ></video>
          </div>
        </section>

        <div class="list-column">
          <section id="home-panel" class="browse-panel" role="tabpanel" aria-labelledby="tab-home">
            <ul id="home-results" class="results card-grid"></ul>
          </section>

          <section
            id="latest-panel"
            class="browse-panel"
            role="tabpanel"
            aria-labelledby="tab-latest"
            hidden
          >
            <ul id="latest-results" class="results card-grid">
              <li class="pager-slot">
                <div class="pager">
                  <button type="button" id="latest-prev">Prev</button>
                  <span id="latest-page-label">Page 1</span>
                  <button type="button" id="latest-next">Next</button>
                </div>
              </li>
            </ul>
          </section>

          <section
            id="top-panel"
            class="browse-panel"
            role="tabpanel"
            aria-labelledby="tab-top"
            hidden
          >
            <div class="top-filters">
              <div class="top-periods" aria-label="Time period">
                <div
                  id="top-presets"
                  class="top-presets"
                  role="group"
                  aria-label="Quick periods"
                >
                  <button type="button" class="top-preset is-active" data-tp="alltime" aria-pressed="true">All Time</button>
                  <button type="button" class="top-preset" data-tp="td" aria-pressed="false">Today</button>
                  <button type="button" class="top-preset" data-tp="yd" aria-pressed="false">Yesterday</button>
                  <button type="button" class="top-preset" data-tp="tw" aria-pressed="false">This Week</button>
                  <button type="button" class="top-preset" data-tp="tm" aria-pressed="false">This Month</button>
                  <button type="button" class="top-preset" data-tp="ty" aria-pressed="false">This Year</button>
                  <button type="button" class="top-preset" data-tp="lw" aria-pressed="false">Last Week</button>
                  <button type="button" class="top-preset" data-tp="lm" aria-pressed="false">Last Month</button>
                  <button type="button" class="top-preset" data-tp="ly" aria-pressed="false">Last Year</button>
                </div>
                <div class="top-custom-rows">
                  <form id="top-custom-last" class="top-custom top-custom-last" autocomplete="off">
                    <span class="top-custom-label">Last</span>
                    <label class="visually-hidden" for="top-last-n">Number</label>
                    <input
                      id="top-last-n"
                      class="top-last-n"
                      type="number"
                      min="1"
                      step="1"
                      value="30"
                      inputmode="numeric"
                    />
                    <label class="visually-hidden" for="top-last-unit">Unit</label>
                    <select id="top-last-unit" class="top-last-unit" aria-label="Last period unit">
                      <option value="d" selected>Days</option>
                      <option value="m">Months</option>
                      <option value="y">Years</option>
                    </select>
                    <button type="submit" class="top-apply">Apply</button>
                  </form>
                  <form id="top-custom-calendar" class="top-custom top-custom-calendar" autocomplete="off">
                    <label class="visually-hidden" for="top-month">Month</label>
                    <select id="top-month" class="top-month" aria-label="Month">
                      <option value="Jan">Jan</option>
                      <option value="Feb">Feb</option>
                      <option value="Mar">Mar</option>
                      <option value="Apr">Apr</option>
                      <option value="May">May</option>
                      <option value="Jun">Jun</option>
                      <option value="Jul">Jul</option>
                      <option value="Aug">Aug</option>
                      <option value="Sep">Sep</option>
                      <option value="Oct">Oct</option>
                      <option value="Nov">Nov</option>
                      <option value="Dec">Dec</option>
                    </select>
                    <label class="visually-hidden" for="top-year">Year</label>
                    <input
                      id="top-year"
                      class="top-year"
                      type="number"
                      min="1990"
                      step="1"
                      inputmode="numeric"
                      aria-label="Year"
                    />
                    <button type="submit" class="top-apply">Apply</button>
                  </form>
                </div>
              </div>
            </div>
            <ul id="top-results" class="results card-grid">
              <li class="pager-slot">
                <div class="pager">
                  <button type="button" id="top-prev">Prev</button>
                  <span id="top-page-label">Page 1</span>
                  <button type="button" id="top-next">Next</button>
                </div>
              </li>
            </ul>
          </section>

          <section
            id="pick-panel"
            class="browse-panel"
            role="tabpanel"
            aria-labelledby="tab-pick"
            hidden
          >
            <div class="top-filters">
              <form id="pick-filters" class="pick-periods" aria-label="Rating filters" autocomplete="off">
                <div class="pick-row">
                  <label class="pick-field" for="pick-action">
                    <span class="pick-label">Action</span>
                    <select id="pick-action" name="action">
                      <option value="0" selected>ANY</option>
                      <option value="1">1+ stars</option>
                      <option value="2">2+ stars</option>
                      <option value="3">3+ stars</option>
                      <option value="4">4+ stars</option>
                    </select>
                  </label>
                  <label class="pick-field" for="pick-comedy">
                    <span class="pick-label">Comedy</span>
                    <select id="pick-comedy" name="comedy">
                      <option value="0" selected>ANY</option>
                      <option value="1">1+ stars</option>
                      <option value="2">2+ stars</option>
                      <option value="3">3+ stars</option>
                      <option value="4">4+ stars</option>
                    </select>
                  </label>
                  <label class="pick-field" for="pick-romance">
                    <span class="pick-label">Romance</span>
                    <select id="pick-romance" name="romance">
                      <option value="0" selected>ANY</option>
                      <option value="1">1+ stars</option>
                      <option value="2">2+ stars</option>
                      <option value="3">3+ stars</option>
                      <option value="4">4+ stars</option>
                    </select>
                  </label>
                  <label class="pick-field" for="pick-storyline">
                    <span class="pick-label">Storyline</span>
                    <select id="pick-storyline" name="storyline">
                      <option value="0" selected>ANY</option>
                      <option value="1">1+ stars</option>
                      <option value="2">2+ stars</option>
                      <option value="3">3+ stars</option>
                      <option value="4">4+ stars</option>
                    </select>
                  </label>
                  <label class="pick-field" for="pick-performance">
                    <span class="pick-label">Performance</span>
                    <select id="pick-performance" name="performance">
                      <option value="0" selected>ANY</option>
                      <option value="1">1+ stars</option>
                      <option value="2">2+ stars</option>
                      <option value="3">3+ stars</option>
                      <option value="4">4+ stars</option>
                    </select>
                  </label>
                  <label class="pick-field" for="pick-ratecount">
                    <span class="pick-label">At Least</span>
                    <select id="pick-ratecount" name="ratecount">
                      <option value="1" selected>1 rates</option>
                      <option value="5">5 rates</option>
                      <option value="10">10 rates</option>
                      <option value="20">20 rates</option>
                      <option value="50">50 rates</option>
                      <option value="100">100 rates</option>
                    </select>
                  </label>
                  <button type="submit" class="top-apply pick-apply">Apply</button>
                </div>
              </form>
            </div>
            <ul id="pick-results" class="results card-grid">
              <li class="pager-slot">
                <div class="pager">
                  <button type="button" id="pick-prev">Prev</button>
                  <span id="pick-page-label">Page 1</span>
                  <button type="button" id="pick-next">Next</button>
                </div>
              </li>
            </ul>
          </section>

          <section
            id="search-panel"
            class="browse-panel"
            role="region"
            aria-label="Search results"
            hidden
          >
            <ul id="results" class="results card-grid"></ul>
          </section>
        </div>
      </div>
      <footer class="tmdb-attrib">
        <a
          class="tmdb-attrib-link"
          href="https://www.themoviedb.org/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            class="tmdb-attrib-logo"
            src="{{ url_for('static', filename='tmdb-logo.svg') }}"
            alt="The Movie Database"
            width="100"
            height="13"
          />
          <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
        </a>
      </footer>
    </main>
    <div id="playbill" class="playbill" hidden>
      <div class="playbill-backdrop" data-playbill-dismiss></div>
      <aside
        id="playbill-panel"
        class="playbill-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="playbill-title"
        tabindex="-1"
      >
        <div class="playbill-handle" aria-hidden="true"></div>
        <button type="button" class="playbill-x" data-playbill-dismiss aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6 18 18M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
          </svg>
        </button>
        <div class="playbill-body">
          <div class="playbill-hero">
            <img id="playbill-poster" class="playbill-poster" alt="" hidden />
            <div class="playbill-copy">
              <h2 id="playbill-title" class="playbill-title"></h2>
              <p id="playbill-year" class="playbill-year" hidden></p>
              <div id="playbill-ratings"></div>
            </div>
          </div>
          <div id="playbill-credits" class="playbill-credits" hidden aria-live="polite">
            <div class="playbill-credit" data-credit-slide></div>
            <div class="playbill-credit" data-credit-slide></div>
          </div>
          <p id="playbill-overview" class="playbill-overview"></p>
        </div>
        <div class="playbill-actions">
          <button type="button" id="playbill-play" class="playbill-play">Play</button>
          <button type="button" class="playbill-close" data-playbill-dismiss>Close</button>
        </div>
      </aside>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/video.js@8.23.4/dist/video.min.js" defer></script>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
