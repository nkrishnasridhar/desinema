<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeSinema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="house" aria-hidden="true">
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
      <div class="grain"></div>
    </div>

    <main class="layout">
      <header class="marquee">
        <p class="marquee-tag">Now showing</p>
        <h1>DeSinema</h1>
      </header>

      <form id="search-form" class="search-form">
        <label class="field">
          <span>Title</span>
          <input
            id="query"
            name="q"
            type="search"
            placeholder="Enter a movie name"
            autocomplete="off"
            required
          />
        </label>
        <label class="field">
          <span>Language</span>
          <select id="language" name="lang">
            {% for language in languages %}
            <option value="{{ language }}"{% if loop.first %} selected{% endif %}>{{ language|capitalize }}</option>
            {% endfor %}
          </select>
        </label>
        <button type="submit">Search</button>
      </form>

      <p id="status" class="status" role="status" hidden></p>

      <section id="player-panel" class="player-panel" hidden>
        <div class="screen-frame">
          <p id="now-playing" class="now-playing">Now playing</p>
          <video id="player" controls playsinline></video>
        </div>
      </section>

      <section class="results-section">
        <ul id="results" class="results"></ul>
        <button id="more-matches" class="more-matches" type="button" hidden>
          Wrong title? See other matches
        </button>
        <ul id="more-results" class="results more-results" hidden></ul>
      </section>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
